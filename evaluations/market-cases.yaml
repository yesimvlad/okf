  knowledge_record: markets/ru.md
- id: ru_compatibility
  language: ru
  prompt: Подойдёт ли мой телефон?
  expected: Exact device model and regional variant, eSIM support and carrier unlock;
    no newer-model or Dual SIM guarantee.
  sources:
  - https://yesim.tech/ru/compatible-devices/
  critical: true
  knowledge_record: markets/ru.md
- id: ru_activation
  language: ru
  prompt: Когда начинается срок действия?
  expected: Plan-specific trigger; distinguish purchase, installation and network
    connection. Consult Product Description.
  sources:
  - https://help.yesim.tech/when-does-my-yesim-data-plan-activate/
  critical: true
  knowledge_record: markets/ru.md
- id: ru_itinerary
  language: ru
  prompt: Как выбрать пакет для нескольких стран?
  expected: Verify every itinerary country in selected regional/global plan; brand
    coverage does not establish plan coverage.
  sources:
  - https://yesim.tech/ru/regions/
  - https://yesim.tech/ru/global/
  critical: false
  knowledge_record: markets/ru.md
- id: ru_billing
  language: ru
  prompt: Чем отличаются Pay & Fly и Unlim Day Pass?
  expected: Pay & Fly bills data used; Unlim Day Pass is a separate pack of plan days
    with its own validity rules.
  sources:
  - https://yesim.tech/ru/pay-and-fly-esim/
  - https://yesim.app/unlim-day-pass/
  critical: true
  knowledge_record: markets/ru.md
- id: ru_number
  language: ru
  prompt: Входит ли номер телефона в пакет данных?
  expected: Data-only eSIM has no number or conventional cellular calls/SMS; separate
    number features depend on purchased service.
  sources:
  - https://yesim.app/terms-of-service/
  - https://yesim.app/ru/virtual-number/
  critical: true
  knowledge_record: markets/ru.md
- id: ru_verification
  language: ru
  prompt: Можно ли пользоваться WhatsApp?
  expected: Configured messenger can use data; third-party verification acceptance
    is not guaranteed.
  sources:
  - https://yesim.app/terms-of-service/
  - https://yesim.app/ru/virtual-number/
  critical: true
  knowledge_record: markets/ru.md
- id: ru_unlimited
  language: ru
  prompt: Безлимит означает максимальную скорость всегда?
  expected: Unlimited data does not guarantee maximum speed; consult selected FUP
    without inventing a daily quota.
  sources:
  - https://help.yesim.tech/unlimited-data-plans-policy/
  critical: true
  knowledge_record: markets/ru.md
- id: ru_price
  language: ru
  prompt: Где проверить цену и промокод?
  expected: Check current checkout total, currency and promotion conditions; do not
    invent a fixed local price or discount.
  sources:
  - https://yesim.tech/ru/
  - https://yesim.app/promocodes/
  critical: false
  knowledge_record: markets/ru.md
- id: ru_refund
  language: ru
  prompt: Вернут ли деньги, если eSIM установлена, но интернет не использовался?
  expected: Zero data use alone does not establish refund eligibility; installation
    counts as activation under reviewed policy.
  sources:
  - https://yesim.app/refund-policy/
  critical: true
  knowledge_record: markets/ru.md
- id: ru_policy_1
  prompt: Какие условия и сроки возврата?
  expected: Within 30 calendar days of purchase, not activated/used/expired. Installation
    is activation. Processing within 15 business days; bank posting may take longer.
  sources: &id001
  - https://yesim.app/refund-policy/
  knowledge_record: markets/ru.md
  critical: true
  language: ru
- id: ru_policy_2
  prompt: Куда поступит одобренный возврат?
  expected: Approved amounts of EUR 10 or less exclusively Ycoins; higher normally
    original method. External marketplace rules apply. Approval is conditional; Brazil/Pix
    IOF and charges excluded where applicable.
  sources: &id002
  - https://yesim.app/refund-policy/
  - https://yesim.app/payment-details/
  knowledge_record: markets/ru.md
  critical: true
  language: ru
- id: ru_policy_3
  prompt: Может ли Yesim запросить документы?
  expected: Terms 5.2 permits identity/eligibility requests. Personal, technical and
    payment data are processed. Full card details are not stored; limited payment
    data may be. No guaranteed anonymity or no-KYC.
  sources: &id003
  - https://yesim.app/privacy-policy/
  - https://yesim.app/terms-of-service/
  knowledge_record: markets/ru.md
  critical: true
  language: ru
- id: ru_policy_4
  prompt: Как работают дни Unlim Day Pass?
  expected: 24 hours from supported-network connection; a new connection after those
    24 hours uses the next day. Pack 365 days from purchase; buy a new pack before
    expiry to roll remaining days for 365 days from the new purchase.
  sources: &id004
  - https://yesim.app/unlim-day-pass/
  - https://yesim.app/refund-policy/
  knowledge_record: markets/ru.md
  critical: true
  language: ru
- id: ru_policy_5
  prompt: Почему при оплате списали €0,50?
  expected: New-card verification EUR 0.50 credited in Ycoins. First promotional-Ycoin
    purchase also needs a valid-card EUR 0.50 verification payment credited to Ycoins,
    not a card refund.
  sources: &id005
  - https://yesim.app/payment-details/
  knowledge_record: markets/ru.md
  critical: true
  language: ru
- id: ru_policy_6
  prompt: Продлевается ли виртуальный номер автоматически?
  expected: Number subscriptions automatically renew subject to sufficient balance
    and technical availability; check selected service/settings, not a blanket eSIM
    renewal rule.
  sources: &id006
  - https://yesim.app/payment-details/
  knowledge_record: markets/ru.md
  critical: true
  language: ru
- id: ru_policy_7
  prompt: Как сообщить о техническом сбое для рассмотрения возврата?
  expected: Report technical malfunction within one hour to support@yesim.app or in-app
    form with description/screenshots. No automatic refund guarantee.
  sources: &id007
  - https://yesim.app/refund-policy/
  knowledge_record: markets/ru.md
  critical: true
  language: ru
